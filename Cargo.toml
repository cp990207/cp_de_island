[package]
name = "memo-pill"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = { version = "0.7.9", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
