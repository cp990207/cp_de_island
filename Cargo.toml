[package]
name = "memo-pill"
version = "1.0.0"
edition = "2024"
description = "A lightweight Dynamic Island style floating widget for Windows"
license = "MIT"
repository = "https://github.com/cp990207/cp_de_island"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[dependencies]
async-trait = "0.1"
dioxus = { version = "0.7.9", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["local-offset", "parsing", "formatting"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
